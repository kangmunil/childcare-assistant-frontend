name: Community Quote E2E

on:
  pull_request:
    paths:
      - "src/pages/CommunityPage.jsx"
      - "src/pages/PostDetailPage.jsx"
      - "src/pages/PostWritePage.jsx"
      - "tests/community-quote-navigation.ci.mjs"
      - "tests/contracts/communityQuoteContract.mjs"
      - "package.json"
      - ".github/workflows/community-quote-e2e.yml"
  push:
    branches:
      - main
    paths:
      - "src/pages/CommunityPage.jsx"
      - "src/pages/PostDetailPage.jsx"
      - "src/pages/PostWritePage.jsx"
      - "tests/community-quote-navigation.ci.mjs"
      - "tests/contracts/communityQuoteContract.mjs"
      - "package.json"
      - ".github/workflows/community-quote-e2e.yml"

jobs:
  quote-e2e:
    runs-on: ubuntu-latest

    env:
      DEV_BYPASS_TOKEN: dev-e2e-token
      API_BASE_URL: http://127.0.0.1:8082
      FRONT_URL: http://127.0.0.1:5174
      FRONTEND_PORT: "5174"

    steps:
      - name: Checkout frontend
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install frontend deps
        run: npm ci

      - name: Install Playwright runtime
        run: |
          npm install --no-save playwright@1.53.2
          npx playwright install --with-deps chromium

      - name: Start frontend
        run: |
          VITE_API_BASE_URL="${API_BASE_URL}" \
          VITE_DEV_BYPASS_TOKEN="${DEV_BYPASS_TOKEN}" \
          npm run dev -- --host 127.0.0.1 --port "${FRONTEND_PORT}" > /tmp/community-quote-frontend.log 2>&1 &
          echo $! > /tmp/community-quote-frontend.pid

      - name: Wait for frontend
        run: |
          frontend_ready=0
          for i in {1..90}; do
            if curl -sS -m 3 "${FRONT_URL}" >/dev/null; then
              frontend_ready=1
              break
            fi
            sleep 2
          done
          if [ "${frontend_ready}" -ne 1 ]; then
            echo "frontend failed to become ready at ${FRONT_URL}"
            tail -n 200 /tmp/community-quote-frontend.log || true
            exit 1
          fi

      - name: Run quote navigation contract test
        run: npm run test:community-quote-e2e:ci

      - name: Dump frontend logs on failure
        if: failure()
        run: |
          echo "=== frontend log ==="
          tail -n 200 /tmp/community-quote-frontend.log || true

      - name: Stop frontend
        if: always()
        run: |
          if [ -f /tmp/community-quote-frontend.pid ]; then
            kill "$(cat /tmp/community-quote-frontend.pid)" || true
          fi
